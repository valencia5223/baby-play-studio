services:
  - type: web
    name: baby-play-studio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # 🎰 로또 탭: 동행복권 최신 회차 확인용 중계 (SPA 규칙보다 먼저)
      - type: rewrite
        source: /dh/*
        destination: https://www.dhlottery.co.kr/*
      - type: rewrite
        source: /*
        destination: /index.html
